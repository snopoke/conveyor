name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in mise.toml (Go, Node, Python, just,
      # golangci-lint), so CI matches local and agent runs exactly.
      - uses: jdx/mise-action@v5
      - name: Standard startup and verification path
        run: ./init.sh
